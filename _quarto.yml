project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"

description-meta: "Website for Dennis Baidoo"
author-meta: "Dennis Baidoo"

website:
  title: "Homepage of Dennis Baidoo"
  image: "files/images/PIWC.JPG"
  description: "Statistical Scientist"
  site-url: "https://dbaidoo.github.io"
  repo-url: "https://github.com/dbaidoo/dbaidoo.github.io"

  open-graph: true
  twitter-card: true


  navbar:
    logo: "files/images/The-Ohio-State-University-Logo-700x394.png"
    logo-alt: "The Ohio State University"

    background: "#30363D"
    foreground: "#D0D0D0"

    pinned: true
    collapse: true
    collapse-below: lg
    search: false


    left:
      - text: RESEARCH
        href: publications.qmd

      - text: BLOG
        href: blog.qmd

      - text: TEACHING
        href: teaching.qmd

      - text: PRESENTATIONS
        href: posts.qmd

      - text: AWARDS & HONORS
        href: Awards.qmd

      - text: NEWS
        href: mediatab.qmd

      - text: PEOPLE
        href: people.qmd


    right:
      - text: CV
        href: files/Dennis.Baidoo_CV_osu.pdf

      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank



  page-navigation: true

  reader-mode: true

  draft-mode: unlinked



  search:
    location: navbar
    type: textbox



  page-footer:
    left: "[DennisBaidoo](https://github.com/dbaidoo/dbaidoo.github.io) &copy; <script>document.write(new Date().getFullYear())</script>"

    center: "Built with [Quarto](https://github.com/drganghe/quarto-academic-website-template), adapted from [Dr. Gang He](http://drganghe.github.io)"

    right:
      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank



  google-analytics:
    tracking-id: ""
    anonymize-ip: true



bibliography: references.bib



format:
  html:

    theme:
      light: cosmo
      dark: darkly


    theme-toggle: true

    respect-user-color-scheme: false


    css: styles.css


    toc: true

    page-layout: full


    smooth-scroll: true


    anchor-sections: true


    footnotes-hover: true


    code-copy: true


    code-link: true


    code-overflow: wrap


    fig-align: center



    link-external-icon: false


    link-external-newwindow: true



    email-obfuscation: javascript



    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px



    include-in-header:
      - "files/includes/_academic.qmd"
      - "Views.html"


      - text: |
          <style>

          /* ===============================
             OSU NAVBAR LOGO SIZE
             =============================== */


          .navbar {
            min-height: 72px !important;
            padding-top: 2px !important;
            padding-bottom: 2px !important;
          }


          .navbar-brand {
            display: flex !important;
            align-items: center !important;
          }


          .navbar-brand img,
          .navbar-logo {
            height: 66px !important;
            max-height: 66px !important;
            width: auto !important;
            object-fit: contain !important;
            padding: 0 !important;
            margin-right: 15px !important;
          }


          @media (max-width: 768px) {

            .navbar {
              min-height: 62px !important;
            }


            .navbar-brand img,
            .navbar-logo {
              height: 55px !important;
              max-height: 55px !important;
            }

          }


          </style>


          <script>

          document.addEventListener("DOMContentLoaded", function () {


            const brand = document.querySelector(".navbar-brand");


            if (brand) {

              brand.href = "index.html";

            }



            const logo = document.querySelector(".navbar-brand img");


            if (logo) {

              logo.style.cursor = "pointer";


              logo.addEventListener("click", function(event) {


                event.preventDefault();

                event.stopPropagation();


                window.location.href =
                "https://cph.osu.edu/phd/biostatistics";


              });


            }


          });


          </script>