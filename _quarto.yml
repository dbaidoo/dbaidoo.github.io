project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!MyUpdate.qmd"
    - "!projects.qmd"
    - "!contact.qmd"
    - "!posts/"
  resources:
    - "files/Dennis_Baidoo_CV_osu__.pdf"
    - "files/images/PIWC.JPG"

description-meta: "Website for Dennis Baidoo"
author-meta: "Dennis Baidoo"

website:
  image: "files/images/PIWC.JPG"
  description: "Ph.D. Student, Division of Biostatistics, College of Public Health, The Ohio State University"
  site-url: "https://dbaidoo.github.io"
  repo-url: "https://github.com/dbaidoo/dbaidoo.github.io"
  open-graph: true
  twitter-card: true
  search: false
  page-navigation: false
  reader-mode: false
  draft-mode: unlinked

format:
  html:
    theme: none
    css: site.css
    page-layout: custom
    canonical-url: true
    toc: false
    smooth-scroll: false
    anchor-sections: false
    code-copy: false
    include-in-header:
      - text: |
          <meta name="google-site-verification" content="3pHmQ-h0wrS_CISpd5JMjWPlBDS9A-Jz_6_On2oYM0Y" />
          <script>document.documentElement.classList.add("js"); try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}</script>
          <style>
            html .theme-toggle { display: none; }
            html.js .theme-toggle { display: inline-flex; position: fixed; z-index: 30; top: 19px; right: 16px; }
            @media (max-width: 820px) { html.js .theme-toggle { top: 14px; right: 12px; } }
            @media print { html.js .theme-toggle { display: none; } }
          </style>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Josefin+Sans:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
      - "Views.html"
    include-before-body: "files/includes/header.html"
    include-after-body: "files/includes/footer.html"
