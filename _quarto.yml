project:
  type: website
  output-dir: docs

# Meta
description-meta: "Dennis Baidoo"
author-meta: "Dennis Baidoo"

website:
  title: "Dennis Baidoo"
  image: "files/images/PIWC.JPG"
  description: "Outstanding Student"
 
  navbar:
    background: "#373D43"

    left:
      - text: RESEARCH
        href: publications.qmd
      - text: BLOG
        href: blog.qmd
      - text: TEACHING
        href: teaching.qmd
      - text: PRESENTATIONS
        href: posts.qmd                 
      - text: AWARDS & HONORS
        href: Awards.qmd
      - text: NEWS
        href: mediatab.qmd
      - text: PEOPLE
        href: people.qmd
  

    right: 
      - text: CV
        href: files/Dennis.Baidoo_CV.pdf
      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "[DennisBaidoo](https://github.com/dbaidoo/dbaidoo.github.io) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Built with [Quarto](https://github.com/drganghe/quarto-academic-website-template), adapted from [Dr. Gang He](http://drganghe.github.io)"
    right:  
      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true
  draft-mode: unlinked
  
  repo-url: https://github.com/drganghe/quarto-academic-website-template
  
  open-graph: true
  twitter-card: true 
  
  site-url: "https://drganghe.github.io/quarto-academic-website-template"
  
  google-analytics:
    tracking-id: ""
    anonymize-ip: true 

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"
