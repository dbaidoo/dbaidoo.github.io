project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
  resources:
    - "files/Dennis_Baidoo_CV_osu__.pdf"
    - "files/images/PIWC.JPG"

description-meta: "Website for Dennis Baidoo"
author-meta: "Dennis Baidoo"

website:
  title: "Dennis Baidoo"
  image: "files/images/PIWC.JPG"
  description: "Ph.D. Student, Division of Biostatistics, College of Public Health, The Ohio State University"
  site-url: "https://dbaidoo.github.io"
  repo-url: "https://github.com/dbaidoo/dbaidoo.github.io"
  open-graph: true
  twitter-card: true
  search: false
  page-navigation: false
  reader-mode: false
  draft-mode: unlinked

format:
  html:
    theme: none
    css: site.css
    page-layout: custom
    toc: false
    smooth-scroll: false
    anchor-sections: false
    code-copy: false
    include-in-header:
      - text: |
          <script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}</script>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Josefin+Sans:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
      - "Views.html"
    include-before-body: "files/includes/header.html"
    include-after-body: "files/includes/footer.html"
