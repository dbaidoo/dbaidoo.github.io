project:
  type: website
  output-dir: docs

description-meta: "Dennis Baidoo"
author-meta: "Dennis Baidoo"

website:
  title: "Dennis Baidoo"
  image: "files/images/PIWC.JPG"
  description: "Outstanding Student"
 
  navbar:
    background: "#373D43"   # keep your original color

    left:
      - text: RESEARCH
        href: publications.qmd
      - text: BLOG
        href: blog.qmd
      - text: TEACHING
        href: teaching.qmd
      - text: PRESENTATIONS
        href: posts.qmd
      - text: AWARDS & HONORS
        href: Awards.qmd
      - text: NEWS
        href: mediatab.qmd
      - text: PEOPLE
        href: people.qmd

    right:
      - text: CV
        href: files/Dennis.Baidoo_CV.pdf
      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank

  page-navigation: true

  page-footer:
    left: "[DennisBaidoo](https://github.com/dbaidoo/dbaidoo.github.io) © <script>document.write(new Date().getFullYear())</script>"
    center: "Built with Quarto"
    right:
      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true
  draft-mode: unlinked

format:
  html:
    color-scheme: light          # ⬅️ CRITICAL: disables auto dark mode
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-overflow: wrap
    fig-align: center
    email-obfuscation: javascript
