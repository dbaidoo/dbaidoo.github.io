project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"

description-meta: "Website for Dennis Baidoo"
author-meta: "Dennis Baidoo"

website:
  title: "Homepage of Dennis Baidoo"
  image: "files/images/PIWC.JPG"
  description: "Statistical Scientist"
  site-url: "https://dbaidoo.github.io"
  repo-url: "https://github.com/dbaidoo/dbaidoo.github.io"

  open-graph: true
  twitter-card: true

  navbar:
    background: "#30363D"
    foreground: "#D0D0D0"
    pinned: true
    collapse: true
    collapse-below: lg
    search: false

    left:
      - text: RESEARCH
        href: publications.qmd

      - text: BLOG
        href: blog.qmd

      - text: TEACHING
        href: teaching.qmd

      - text: PRESENTATIONS
        href: posts.qmd

      - text: AWARDS & HONORS
        href: Awards.qmd

      - text: NEWS
        href: mediatab.qmd

      - text: PEOPLE
        href: people.qmd


    right:
      - text: CV
        href: files/Dennis.Baidoo_CV_osu.pdf

      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank


  page-navigation: true

  reader-mode: true

  draft-mode: unlinked


  search:
    location: navbar
    type: textbox


  page-footer:
    left: "[DennisBaidoo](https://github.com/dbaidoo/dbaidoo.github.io) &copy; <script>document.write(new Date().getFullYear())</script>"

    center: "Built with [Quarto](https://github.com/drganghe/quarto-academic-website-template), adapted from [Dr. Gang He](http://drganghe.github.io)"

    right:
      - icon: github
        href: https://github.com/dbaidoo/dbaidoo.github.io
        target: _blank


  google-analytics:
    tracking-id: ""
    anonymize-ip: true


bibliography: references.bib


format:
  html:

    theme:
      light: cosmo
      dark: darkly

    theme-toggle: true

    respect-user-color-scheme: false

    css: styles.css

    toc: true

    page-layout: full

    smooth-scroll: true

    anchor-sections: true

    footnotes-hover: true

    code-copy: true

    code-link: true

    code-overflow: wrap

    fig-align: center


    link-external-icon: false

    link-external-newwindow: true


    email-obfuscation: javascript


    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px


    include-in-header:
      - "files/includes/_academic.qmd"
      - "Views.html"